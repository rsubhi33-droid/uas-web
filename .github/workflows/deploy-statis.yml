name: Deploy Web Statis (UAS)

on:
  push:
    branches:
      - main
    paths:
      - 'web-statis/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repositori GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Login ke Docker Hub menggunakan GitHub Secrets kamu
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Build dan Push Docker Image ke repositori uciiboss/uas-statis
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./web-statis
        file: ./web-statis/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/uas-statis:latest

    # 4. Melakukan SSH ke AWS EC2 dan deploy ulang kontainer secara otomatis
    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: 22
        script: |
          # Berhenti jika ada error
          set -e
          
          # Login ke Docker Hub di sisi server AWS
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # Tarik image terbaru dari Docker Hub
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uas-statis:latest
          
          # Hentikan dan hapus kontainer lama jika sudah ada dengan nama uas-web-statis
          docker stop uas-web-statis || true
          docker rm uas-web-statis || true
          
          # Jalankan kontainer baru dengan port mapping 80:80 sesuai regulasi keamanan AWS kamu
          docker run -d \
            --name uas-web-statis \
            -p 80:80 \
            --restart always \
            ${{ secrets.DOCKERHUB_USERNAME }}/uas-statis:latest