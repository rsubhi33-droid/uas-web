# PENTING: File ini harus dipindahkan ke ROOT monorepo kamu
# Letakkan di: .github/workflows/deploy-dinamis.yml (bukan di dalam web-dinamis/)

name: Deploy Web Dinamis Top-Up Game (UAS)

on:
  push:
    branches:
      - main
    paths:
      - 'web-dinamis/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./web-dinamis
        file: ./web-dinamis/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/uas-dinamis:latest

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: 22
        script: |
          set -e

          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi

          mkdir -p /home/${{ secrets.AWS_USERNAME }}/uas-topup

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uas-dinamis:latest

          cat > /home/${{ secrets.AWS_USERNAME }}/uas-topup/docker-compose.yml << 'COMPOSE'
          version: '3.8'
          services:
            web:
              image: uciiboss/uas-dinamis:latest
              ports:
                - "3000:80"
              depends_on:
                - db
              environment:
                DB_HOST: db
                DB_USER: root
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                DB_NAME: uas_topup
              restart: always
              networks:
                - topup-network
            db:
              image: mariadb:10.6
              restart: always
              environment:
                MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
                MYSQL_DATABASE: uas_topup
              volumes:
                - db_data:/var/lib/mysql
              networks:
                - topup-network
          volumes:
            db_data:
          networks:
            topup-network:
              driver: bridge
          COMPOSE

          cd /home/${{ secrets.AWS_USERNAME }}/uas-topup
          sudo docker-compose down || true
          sudo docker-compose up -d
