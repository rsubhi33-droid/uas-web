name: Deploy Web Dinamis Top-Up Game (UAS)

on:
  push:
    branches:
      - main
    paths:
      - 'web-dinamis/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ./web-dinamis
        file: ./web-dinamis/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/uas-dinamis:latest

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: 22
        script: |
          set -e

          # Install docker-compose jika belum ada
          if ! command -v docker-compose &> /dev/null; then
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi

          mkdir -p /home/${{ secrets.AWS_USERNAME }}/uas-topup

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uas-dinamis:latest

          # ─── Tulis docker-compose.yml ───────────────────────────────────
          cat > /home/${{ secrets.AWS_USERNAME }}/uas-topup/docker-compose.yml << 'COMPOSE'
          version: '3.8'
          services:
            web:
              image: uciiboss/uas-dinamis:latest
              ports:
                - "3000:80"
              depends_on:
                - db
              environment:
                DB_HOST: db
                DB_USER: root
                DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                DB_NAME: uas_topup
              restart: always
              networks:
                - topup-network
            db:
              image: mariadb:10.6
              restart: always
              environment:
                MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
                MYSQL_DATABASE: uas_topup
              volumes:
                - db_data:/var/lib/mysql
                - /home/${{ secrets.AWS_USERNAME }}/uas-topup/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
              networks:
                - topup-network
          volumes:
            db_data:
          networks:
            topup-network:
              driver: bridge
          COMPOSE

          # ─── Tulis init.sql (TANPA single-quote di ENDSQL agar $2y di-escape) ──
          # Pakai \$ untuk escape dollar sign supaya shell tidak expand variable
          cat > /home/${{ secrets.AWS_USERNAME }}/uas-topup/init.sql << "ENDSQL"
          CREATE TABLE IF NOT EXISTS produk_game (
              id INT AUTO_INCREMENT PRIMARY KEY,
              nama_game VARCHAR(100) NOT NULL,
              nominal VARCHAR(50) NOT NULL,
              harga INT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS transaksi (
              id INT AUTO_INCREMENT PRIMARY KEY,
              invoice VARCHAR(50) NOT NULL,
              user_id VARCHAR(50) NOT NULL,
              zone_id VARCHAR(50) NULL,
              nama_game VARCHAR(100) NOT NULL,
              nominal VARCHAR(50) NOT NULL,
              total_harga INT NOT NULL,
              status VARCHAR(20) DEFAULT 'Pending',
              tanggal TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS admin (
              id INT AUTO_INCREMENT PRIMARY KEY,
              username VARCHAR(50) NOT NULL,
              password VARCHAR(255) NOT NULL
          );

          INSERT IGNORE INTO produk_game (nama_game, nominal, harga) VALUES
          ('Mobile Legends', '86 Diamonds', 20000),
          ('Mobile Legends', '172 Diamonds', 39000),
          ('Mobile Legends', '257 Diamonds', 58000),
          ('Mobile Legends', '514 Diamonds', 115000),
          ('Free Fire', '70 Diamonds', 18000),
          ('Free Fire', '140 Diamonds', 35000),
          ('Free Fire', '355 Diamonds', 88000),
          ('Genshin Impact', '60 Primogems', 15000),
          ('Genshin Impact', '300 Primogems', 75000);

          INSERT IGNORE INTO admin (username, password) VALUES
          ('admin', '\$2y\$10\$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi');
          ENDSQL

          # ─── Reset volume lama agar init.sql dijalankan ulang ──────────
          cd /home/${{ secrets.AWS_USERNAME }}/uas-topup
          sudo docker-compose down || true
          sudo docker volume rm uas-topup_db_data || true

          # ─── Jalankan ulang ─────────────────────────────────────────────
          sudo docker-compose up -d